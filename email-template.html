<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>New Birthday Wish Received!</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
<style>
body{background:#fffdf5;font-family:'Comic Sans MS',cursive,sans-serif;color:#333;padding:0;margin:0}.container{max-width:600px;margin:20px auto;background:#fffefa;border-radius:15px;padding:30px;box-shadow:0 8px 25px rgba(255,192,203,.2);border:3px dashed #ffb6c1}.header{background:linear-gradient(to right,#fcb045,#fd1d1d,#833ab4);color:#fff;padding:20px;border-radius:12px;text-align:center}.header h1{margin:0;font-size:26px}.section{margin-top:25px}.label{font-weight:bold;color:#ff4081}.message-box{background:#fff4f8;border-left:5px solid #ff69b4;padding:20px;margin:20px 0;border-radius:10px;font-size:16px;line-height:1.6}.footer{text-align:center;font-size:13px;color:#888;margin-top:40px}.balloons{font-size:22px}.timestamp{font-size:14px;color:#999;text-align:right;margin-top:10px}@media(max-width:640px){.container{margin:10px;padding:20px}}
</style>
</head>
<body>
<div class="container">
<div class="header"><h1><i class="fa-solid fa-cake-candles"></i> A New Birthday Wish Just Flew In!</h1></div>
<div class="section"><p><span class="label"><i class="fa-solid fa-user"></i> Wisher's Name:</span> <strong>{{NAME}}</strong></p><p><span class="label"><i class="fa-solid fa-circle-question"></i> Pahchan (optional):</span> {{PAHCHAN}}</p></div>
<div class="message-box"><div class="balloons"><i class="fa-solid fa-cake-candles"></i> <i class="fa-solid fa-gift"></i> <i class="fa-solid fa-party-horn"></i> <i class="fa-solid fa-envelope"></i></div><p>{{MESSAGE}}</p></div>
<p class="timestamp"><i class="fa-solid fa-calendar-days"></i> {{TIMESTAMP}}</p>
<div class="section"><a href="{{SHARE_URL}}" style="display:inline-block;background-color:#0d6efd;color:white;text-decoration:none;padding:10px 20px;border-radius:4px;font-size:15px;text-align:center;">View Birthday Experience</a></div>
<div class="footer">Sent with joy via <strong>Birthday Experience</strong> <i class="fa-solid fa-heart"></i><br>Turning wishes into memories <i class="fa-solid fa-gift"></i></div>
</div>
</body>
</html>
